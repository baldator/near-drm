[package]
name = "vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs" 

[dependencies]
near-sdk = { version = "5.4.1", features = ["abi"] }
near-abi = "5.4.1"
schemars = "0.8"
borsh = "1.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
